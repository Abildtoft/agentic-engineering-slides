nodeLinker: node-modules

# @mascotbot packages come from a private registry that authenticates with the
# same key the SDK runs on. The private package is isolated from the root
# deployment manifest; install it with `MASCOT_API_KEY=… yarn --cwd
# scripts/mascot-render install`. Unset, the scope still resolves but the
# install is refused.
npmScopes:
  mascotbot:
    npmRegistryServer: "https://npm.mascot.bot/"
    npmAuthToken: "${MASCOT_API_KEY:-}"
