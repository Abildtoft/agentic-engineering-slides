nodeLinker: node-modules

# @mascotbot packages come from a private registry that authenticates with the
# same key the SDK runs on. Export MASCOT_API_KEY (it is in .env — `set -a;
# source .env` or pass it inline) before `yarn install`; unset, the scope still
# resolves but the install is refused.
npmScopes:
  mascotbot:
    npmRegistryServer: "https://npm.mascot.bot/"
    npmAuthToken: "${MASCOT_API_KEY:-}"
